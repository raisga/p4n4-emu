name: Publish to PyPI

# On a GitHub release (tag vX.Y.Z, matching pyproject.toml). The Image workflow
# publishes the simulator image for the same tag, which this version pulls.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Release $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      # The wheel must carry what isn't Python: profiles, overlay templates, the sim image
      - name: Check the wheel's data files
        run: |
          unzip -l dist/*.whl > files.txt
          for f in profiles/definitions/rpi5.yml overlays/templates/stack.emu.yml.j2 \
                   sim/Dockerfile sim/requirements.txt; do
            grep -q "p4n4_emu/$f" files.txt || { echo "::error::wheel lacks p4n4_emu/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
