name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The integration job starts the iot stack, so it runs on demand and weekly only
  workflow_dispatch:
    inputs:
      profile:
        description: Hardware profile for the integration run
        default: rpi4
      emulate:
        description: Also run on x86 with arm64 images under QEMU
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Real stacks for tests/test_real_stacks.py (overlays merged by `docker compose config`)
      P4N4_STACKS_DIR: ${{ github.workspace }}/../stacks
      P4N4_DASHBOARD_DIR: ${{ github.workspace }}/../dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Checkout stack source repos
        run: |
          git clone --depth 1 https://github.com/raisga/p4n4-iot.git "$P4N4_STACKS_DIR/iot"
          git clone --depth 1 https://github.com/raisga/p4n4-ai.git "$P4N4_STACKS_DIR/ai"
          git clone --depth 1 https://github.com/raisga/p4n4-edge.git "$P4N4_STACKS_DIR/edge"
          git clone --depth 1 https://github.com/raisga/p4n4-dashboard.git "$P4N4_DASHBOARD_DIR"
      - run: pytest --cov=p4n4_emu --cov-report=term-missing

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: ""
          # Native arm64, as on a Raspberry Pi
          - runner: ubuntu-24.04-arm
            arch: ""
          # arm64 images on x86 through QEMU, as `p4n4-emu up --profile rpi5` runs on a laptop
          - runner: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      P4N4_STACKS_DIR: ${{ github.workspace }}/../stacks
      P4N4_EMU_IT_PROFILE: ${{ inputs.profile || 'rpi4' }}
      P4N4_EMU_IT_ARCH: ${{ matrix.arch }}
      # Everything is slower under QEMU
      P4N4_EMU_IT_TIMEOUT: ${{ matrix.arch && '600' || '240' }}
    steps:
      - name: Skip the QEMU run unless asked for
        if: matrix.arch && !inputs.emulate
        run: echo "SKIP=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - uses: docker/setup-qemu-action@v3
        if: env.SKIP != '1' && matrix.arch
        with:
          platforms: ${{ matrix.arch }}
      - if: env.SKIP != '1'
        run: |
          pip install -e ".[dev]"
          git clone --depth 1 https://github.com/raisga/p4n4-iot.git "$P4N4_STACKS_DIR/iot"
      - if: env.SKIP != '1'
        run: pytest --run-integration tests/test_integration.py -v
      - name: Container logs
        if: failure() && env.SKIP != '1'
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::$c"; docker logs --tail 200 "$c"; echo "::endgroup::"
          done
