name: mcu-class
# Not a microcontroller: an x86 Linux container squeezed to 256 MB, to see how
# the stacks behave at the bottom of the range. The iot stack doesn't fit (InfluxDB
# alone uses more), so expect OOM kills. Real MCU nodes speak MQTT from firmware;
# the sensor simulator stands in for them.
description: "Ultra-constrained Linux — 1 core / 256 MB (not an MCU)"
arch: x86_64
cpus: 1
memory: "256m"
memory_swap: "256m"
blkio_weight: 100
blkio_read_bps: 10485760
blkio_write_bps: 10485760
